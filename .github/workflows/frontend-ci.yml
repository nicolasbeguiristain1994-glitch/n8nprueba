name: Verified release checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPS_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start PostgreSQL 17 for validation
        run: |
          # Prefer Google's Docker Hub cache, with Docker Hub as the daemon fallback.
          # Configure the daemon before pulling: job services start before any step.
          sudo python3 - <<'PYTHON'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          mirrors = config.get('registry-mirrors', [])
          config['registry-mirrors'] = list(dict.fromkeys(['https://mirror.gcr.io', *mirrors]))
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          PYTHON
          sudo systemctl restart docker
          docker pull postgres:17
          docker run --detach --name release-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD=local-test-only --env POSTGRES_DB=postgres \
            --health-cmd 'pg_isready -U postgres -d postgres' \
            --health-interval 5s --health-timeout 5s --health-retries 10 postgres:17
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' release-postgres)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs release-postgres
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix frontend --omit=dev --audit-level=high
      # release.mjs includes campaign-risk-postgres.test.ts and campaign-risk-alerts-postgres.test.ts with real PostgreSQL,
      # plus the campaign risk API/UI tests; one invocation preserves exact-SHA proof.
      - name: Validate exact Git version, migrations, campaign protection and alert outbox, frontend and build
        run: node scripts/ops/release.mjs validate
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: .local-tools/release-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Stop validation database
        if: always()
        run: docker rm --force release-postgres || true
