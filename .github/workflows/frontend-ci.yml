name: Verified release checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      OPS_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Validate exact Git version, real migrations, frontend and build
        run: node scripts/ops/release.mjs validate
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: .local-tools/release-validation.json
          include-hidden-files: true
